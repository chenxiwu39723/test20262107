<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經濟學系 2026 秋季營隊報名系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        econ: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Noto Sans TC', 'serif'],
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .bg-pattern {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-pattern font-sans min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-filter blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-econ-600 to-amber-500 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    經
                </div>
                <div>
                    <h1 class="text-white font-serif font-bold text-lg leading-tight">國立大學經濟學系</h1>
                    <p class="text-slate-400 text-xs">Department of Economics</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center space-x-2 text-xs text-amber-400 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-full">
                <i class="fa-solid fa-fire"></i>
                <span>名額有限，請盡速報名</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full">
        <!-- Activity Banner Card -->
        <div class="bg-gradient-to-r from-slate-900 via-econ-900 to-slate-900 rounded-3xl p-6 md:p-10 border border-slate-700 shadow-2xl mb-8 relative overflow-hidden">
            <div class="relative z-10 grid md:grid-cols-3 gap-8 items-center">
                <div class="md:col-span-2 space-y-4">
                    <span class="px-3 py-1 bg-econ-600/20 text-econ-100 border border-econ-600/40 rounded-full text-xs font-semibold tracking-wide">
                        2026 特別講座營隊
                    </span>
                    <h2 class="text-3xl md:text-4xl font-serif font-bold text-white tracking-wide leading-tight">
                        經濟數據與決策分析工作坊
                    </h2>
                    <p class="text-slate-300 text-sm leading-relaxed">
                        探索經濟模型的現實應用，從個體行為到總體趨勢。專為有志深入經濟學領域的同學設計，結合數據實作與分組個案討論。
                    </p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                        <div class="flex items-center space-x-3 bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <i class="fa-regular fa-calendar-check text-amber-400 text-lg"></i>
                            <div>
                                <p class="text-xs text-slate-400">活動日期</p>
                                <p class="text-sm font-semibold text-white">10 月 7 日 (星期三)</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3 bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                            <i class="fa-regular fa-clock text-amber-400 text-lg"></i>
                            <div>
                                <p class="text-xs text-slate-400">活動時間</p>
                                <p class="text-sm font-semibold text-white">晚上 19:00 - 21:00</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Live Counter Stats -->
                <div class="bg-slate-800/80 rounded-2xl p-5 border border-slate-700 flex flex-col justify-between space-y-4 text-center">
                    <div>
                        <p class="text-xs text-slate-400 mb-1">已報名人數 / 總名額</p>
                        <div class="flex justify-center items-baseline space-x-1">
                            <span id="regCount" class="text-4xl font-bold font-serif text-amber-400">--</span>
                            <span class="text-slate-400 text-lg">/ 60 人</span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-amber-400 h-full w-0 transition-all duration-500"></div>
                    </div>
                    <button onclick="fetchRegistrations()" class="text-xs text-slate-400 hover:text-amber-400 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-rotate"></i>
                        <span>更新報名人數</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 mb-6 border-b border-slate-800 pb-2">
            <button id="tabRegisterBtn" onclick="switchTab('register')" class="px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center space-x-2 bg-econ-600 text-white shadow-lg">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>線上報名</span>
            </button>
            <button id="tabManageBtn" onclick="switchTab('manage')" class="px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center space-x-2 text-slate-400 hover:bg-slate-800">
                <i class="fa-solid fa-sliders"></i>
                <span>查詢 / 修改 / 取消報名</span>
            </button>
        </div>

        <!-- TAB 1: Registration Form Card -->
        <div id="tabRegister" class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-200">
            <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center space-x-2 border-b border-slate-100 pb-4">
                <i class="fa-solid fa-user-plus text-econ-600"></i>
                <span>填寫報名資料</span>
            </h3>

            <form id="regForm" onsubmit="handleCreate(event)" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- 學號 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                            學號 <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-400"></i>
                            <input type="text" id="regStudentId" required placeholder="例如：B11304001"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-econ-600 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <!-- 姓名 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                            姓名 <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400"></i>
                            <input type="text" id="regName" required placeholder="請輸入真實姓名"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-econ-600 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <!-- 分組選擇 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                            分組意願 (A, B, C) <span class="text-red-500">*</span>
                        </label>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="flex items-center justify-center space-x-2 border border-slate-200 p-2.5 rounded-xl cursor-pointer hover:bg-econ-50 transition has-[:checked]:border-econ-600 has-[:checked]:bg-econ-50 has-[:checked]:text-econ-800 font-semibold text-sm">
                                <input type="radio" name="regGroup" value="A" required class="accent-econ-600">
                                <span>A 組 (個體)</span>
                            </label>
                            <label class="flex items-center justify-center space-x-2 border border-slate-200 p-2.5 rounded-xl cursor-pointer hover:bg-econ-50 transition has-[:checked]:border-econ-600 has-[:checked]:bg-econ-50 has-[:checked]:text-econ-800 font-semibold text-sm">
                                <input type="radio" name="regGroup" value="B" class="accent-econ-600">
                                <span>B 組 (總體)</span>
                            </label>
                            <label class="flex items-center justify-center space-x-2 border border-slate-200 p-2.5 rounded-xl cursor-pointer hover:bg-econ-50 transition has-[:checked]:border-econ-600 has-[:checked]:bg-econ-50 has-[:checked]:text-econ-800 font-semibold text-sm">
                                <input type="radio" name="regGroup" value="C" class="accent-econ-600">
                                <span>C 組 (計量)</span>
                            </label>
                        </div>
                    </div>

                    <!-- 電子郵件 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                            電子信箱 <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400"></i>
                            <input type="email" id="regEmail" required placeholder="student@university.edu.tw"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-econ-600 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-econ-600 to-econ-800 hover:from-econ-800 hover:to-slate-900 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>送出報名資料</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- TAB 2: Management Card -->
        <div id="tabManage" class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-200 hidden">
            <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center space-x-2 border-b border-slate-100 pb-4">
                <i class="fa-solid fa-magnifying-glass text-econ-600"></i>
                <span>報名資料查詢與維護</span>
            </h3>

            <!-- Search Area -->
            <div class="flex gap-3 mb-6">
                <div class="relative flex-1">
                    <i class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchStudentId" placeholder="請輸入報名時的學號"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-econ-600 outline-none text-sm">
                </div>
                <button onclick="handleSearch()" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition flex items-center space-x-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>查詢</span>
                </button>
            </div>

            <!-- Edit Form -->
            <div id="editArea" class="bg-slate-50 border border-slate-200 rounded-2xl p-6 hidden space-y-4">
                <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                    <span class="font-bold text-slate-800">查獲報名資料</span>
                    <span class="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-medium">報名成功</span>
                </div>

                <form id="editForm" onsubmit="handleUpdate(event)" class="space-y-4">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">學號 (不可修改)</label>
                            <input type="text" id="editStudentId" readonly class="w-full bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-sm font-mono cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">姓名</label>
                            <input type="text" id="editName" required class="w-full border border-slate-300 px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-econ-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">組別</label>
                            <select id="editGroup" required class="w-full border border-slate-300 px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-econ-600 outline-none">
                                <option value="A">A 組 (個體)</option>
                                <option value="B">B 組 (總體)</option>
                                <option value="C">C 組 (計量)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">電子信箱</label>
                            <input type="email" id="editEmail" required class="w-full border border-slate-300 px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-econ-600 outline-none">
                        </div>
                    </div>

                    <div class="flex justify-end space-x-3 pt-2">
                        <button type="button" onclick="handleDelete()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>取消/刪除報名</span>
                        </button>
                        <button type="submit" class="bg-econ-600 hover:bg-econ-800 text-white px-5 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-1">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>儲存修改</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500">
        <p>© 2026 國立大學經濟學系 All Rights Reserved.</p>
    </footer>

    <!-- JS Logic -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxU-idsNbYOLVeUytg91HhlI6otVuiMWPEBoSuqd0wVM42llbhJWxTs0bT4B1IdRzY85A/exec";
        let cachedData = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchRegistrations();
        });

        function switchTab(tab) {
            const regTab = document.getElementById('tabRegister');
            const manageTab = document.getElementById('tabManage');
            const regBtn = document.getElementById('tabRegisterBtn');
            const manageBtn = document.getElementById('tabManageBtn');

            if (tab === 'register') {
                regTab.classList.remove('hidden');
                manageTab.classList.add('hidden');
                regBtn.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center space-x-2 bg-econ-600 text-white shadow-lg";
                manageBtn.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center space-x-2 text-slate-400 hover:bg-slate-800";
            } else {
                regTab.classList.add('hidden');
                manageTab.classList.remove('hidden');
                manageBtn.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center space-x-2 bg-econ-600 text-white shadow-lg";
                regBtn.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition flex items-center space-x-2 text-slate-400 hover:bg-slate-800";
            }
        }

        async function fetchRegistrations() {
            try {
                const res = await fetch(`${API_URL}?action=read`);
                const json = await res.json();
                if (json.success) {
                    cachedData = json.data;
                    updateStats(cachedData.length);
                }
            } catch (err) {
                console.error("無法連線至 API", err);
            }
        }

        function updateStats(count) {
            document.getElementById('regCount').textContent = count;
            const percentage = Math.min((count / 60) * 100, 100);
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        async function handleCreate(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>傳送中...</span>`;

            const studentId = document.getElementById('regStudentId').value.trim();
            const name = document.getElementById('regName').value.trim();
            const group = document.querySelector('input[name="regGroup"]:checked')?.value;
            const email = document.getElementById('regEmail').value.trim();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'create', studentId, name, group, email })
                });
                const result = await res.json();

                if (result.success) {
                    alert('🎉 報名成功！');
                    document.getElementById('regForm').reset();
                    fetchRegistrations();
                } else {
                    alert('⚠️ 報名失敗：' + result.message);
                }
            } catch (err) {
                alert('連線發生錯誤，請稍後再試。');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i><span>送出報名資料</span>`;
            }
        }

        function handleSearch() {
            const sid = document.getElementById('searchStudentId').value.trim();
            if (!sid) return alert('請輸入學號');

            const item = cachedData.find(d => d.studentId.toUpperCase() === sid.toUpperCase());
            const editArea = document.getElementById('editArea');

            if (item) {
                document.getElementById('editStudentId').value = item.studentId;
                document.getElementById('editName').value = item.name;
                document.getElementById('editGroup').value = item.group;
                document.getElementById('editEmail').value = item.email;
                editArea.classList.remove('hidden');
            } else {
                editArea.classList.add('hidden');
                alert('未找到該學號的報名紀錄。');
            }
        }

        async function handleUpdate(e) {
            e.preventDefault();
            const studentId = document.getElementById('editStudentId').value;
            const name = document.getElementById('editName').value.trim();
            const group = document.getElementById('editGroup').value;
            const email = document.getElementById('editEmail').value.trim();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'update', studentId, name, group, email })
                });
                const result = await res.json();

                if (result.success) {
                    alert('✅ 報名資料已成功修改！');
                    fetchRegistrations();
                } else {
                    alert('⚠️ 修改失敗：' + result.message);
                }
            } catch (err) {
                alert('修改過程發生錯誤。');
            }
        }

        async function handleDelete() {
            const studentId = document.getElementById('editStudentId').value;
            if (!confirm(`確定要取消學號 ${studentId} 的報名嗎？`)) return;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', studentId })
                });
                const result = await res.json();

                if (result.success) {
                    alert('🗑️ 已成功取消報名！');
                    document.getElementById('editArea').classList.add('hidden');
                    document.getElementById('searchStudentId').value = '';
                    fetchRegistrations();
                } else {
                    alert('⚠️ 刪除失敗：' + result.message);
                }
            } catch (err) {
                alert('刪除過程發生錯誤。');
            }
        }
    </script>
</body>
</html>
